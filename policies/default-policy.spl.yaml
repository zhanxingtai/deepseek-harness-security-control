      - name: 写 ~/.ssh/authorized_keys 触发 block（Tier-1 后门）
        input:
          actionType: agent_tool_call
          toolName: write
          params:
            path: /root/.ssh/authorized_keys
        expectedDecision: block
      - name: 写 ~/.ssh/config 触发 block（Tier-1 配置篡改）
        input:
          actionType: agent_tool_call
          toolName: write
          params:
            path: /root/.ssh/config
        expectedDecision: block
      - name: 写 /tmp/test.txt 合法不命中
        input:
          actionType: agent_tool_call
          toolName: write
          params:
            path: /tmp/test.txt
        expectedDecision: allow
      - name: 写 ~/.bashrc 合法不命中（用户配置非 Tier-1 后门）
        input:
          actionType: agent_tool_call
          toolName: write
          params:
            path: /root/.bashrc
        expectedDecision: allow
    notes: |
      治理项：补足 testCases 正例覆盖（cron / systemd /
      authorized_keys / .ssh/config）+ 负向允许（/tmp, ~/.bashrc）。
      保留 Tier-1 名单：cron / systemd / authorized_keys / .ssh/config /
      Windows Startup / Windows Tasks。known_hosts 不在本规则覆盖范围（Tier-2
      路径，写入攻击可由 self_protection 旁路观测）。
  - id: block-write-system-backdoor-warn
    name: 阻断写入系统后门/启动项
    enabled: true
    priority: 930
    category: intrusion_defense
    severity: medium
    match:
      actionType:
        - agent_tool_call
      toolName:
        - file_write
        - fs.writeFile
        - write
        - Write
        - edit
        - Edit
        - patch_file
        - str_replace
        - multi_edit
      paramsRegex:
        path:
          - ^/etc/profile
          - ^/etc/bash\.bashrc
          - ^/etc/rc\.local
          # Debian 系路径是 /etc/rc.d/rc.local，原表只有 RedHat 系的 /etc/rc\.local
          - ^/etc/rc\.d/rc\.local$
          # zsh 的系统级启动文件同样是持久化位，POSIX 侧此前只有 bash 的。
          - ^/etc/zsh/zshrc$
          - ^/etc/init\.d/
    action:
      decision: warn
      message: 阻断写入系统后门/启动项:命中非 critical 路径,仅记录,工具继续执行
      blockCode: INTRUSION_DEFENSE_BACKDOOR_WRITE_011
      appealable: true
    testCases:
      - name: 写 /etc/profile.d/evil.sh 触发 warn
        input:
          actionType: agent_tool_call
          toolName: write
          params:
            path: /etc/profile.d/evil.sh
        expectedDecision: warn
      - name: 写 ~/.bashrc 合法不命中（2026-10-10 FP 收窄:用户 dotfile 移出启动项名单,只保留系统级）
        input:
          actionType: agent_tool_call
          toolName: write
          params:
            path: /root/.bashrc
        expectedDecision: allow
      - name: 写 /tmp/test.txt 合法不命中
        input:
          actionType: agent_tool_call
          toolName: write
          params:
            path: /tmp/test.txt
        expectedDecision: allow
    notes: 默认阻断规则 — 拦截已知危险行为。2026-10-10 FP 收窄(宁漏勿误):用户级 dotfile
      (~/.bashrc/.bash_profile/.bash_login/.zshrc/.profile)写入不再告警——开发者改自己的
      rc 文件是正常操作;保留系统级启动项(/etc/profile /etc/bash.bashrc /etc/rc.local
      /etc/init.d/)告警面。
  - id: block-write-sensitive-system-files
    name: 阻断写入敏感系统文件（path 维度 · Tier-1 名单）
    enabled: true
    priority: 950
    category: intrusion_defense
    severity: critical
    match:
      actionType:
        - agent_tool_call
      toolName:
        - file_write
        - fs.writeFile
        - write
        - Write
        - edit
        - Edit
        - patch_file
        - str_replace
        - multi_edit
      paramsRegex:
        path:
          - ^/etc/passwd
          - ^/etc/shadow
          - ^/etc/gshadow
          - ^/etc/sudoers
          # /etc/hosts 已移出：加一条本地域名是 docker/dev 的常规动作。
          # 删除仍由 block-delete-sensitive-files 硬拦。
          # 与 block-sensitive-system-files-warn 同步收窄：原 `^/root/\.ssh/` 覆盖
          # ~/.ssh 下的一切，写/删 known_hosts、config 这类日常文件会被硬拦。
          # 只保留私钥本体、授权密钥表、服务端主机密钥目录。必须用 `$` 而非
          # `\b` 收尾（`.pub` 后是非单词字符，`\b` 会把公钥当私钥拦下）。
          - ^/root/\.ssh/id_(?:rsa|dsa|ecdsa|ed25519)$
          - ^/root/\.ssh/authorized_keys$
          - ^/root/\.ssh/known_hosts\.d/
          - ^/root/\.aws/
          - ^/root/\.docker/
          - ^/root/\.netrc
          - ^/root/\.git-credentials
          - ^C:\\Windows\\System32\\
    action:
      decision: block
      blockReason: 写入敏感系统文件已被安全策略阻断
      blockCode: INTRUSION_DEFENSE_WRITE_SENSITIVE_012
      appealable: true
    testCases:
      - name: 写 /tmp 合法不命中(负向)
        input:
          actionType: agent_tool_call
          toolName: write
          params:
            path: /tmp/test.txt
        expectedDecision: allow
      - name: 写 ~/.claude/ 合法不命中(负向)
        input:
          actionType: agent_tool_call
          toolName: write
          params:
            path: /root/.claude/settings.json
        expectedDecision: allow
      - name: 写 /etc/gshadow 触发 block
        input:
          actionType: agent_tool_call
          toolName: write
          params:
            path: /etc/gshadow
        expectedDecision: block
      - name: 写 /root/.npmrc 不命中（Tier-2 路径移除主轨覆盖）
        input:
          actionType: agent_tool_call
          toolName: write
          params:
            path: /root/.npmrc
        expectedDecision: allow
      - name: 写 /root/.pypirc 不命中（Tier-2 路径移除主轨覆盖）
        input:
          actionType: agent_tool_call
          toolName: write
          params:
            path: /root/.pypirc
        expectedDecision: allow
      - name: 写 /root/.ssh/id_rsa 触发 block（Tier-1 保留）
        input:
          actionType: agent_tool_call
          toolName: write
          params:
            path: /root/.ssh/id_rsa
        expectedDecision: block
    notes: |
      同步项：收窄 pathRegex 移除 Tier-2 路径
      （.npmrc / .pypirc / .bash_history）。**硬约束：禁止新增 -warn 副轨**，
      故 Tier-2 路径**完全不覆盖**（丢覆盖 > 误拦截业务，与用户原则 1 一致）。
      保留 Tier-1 名单：/etc 系统文件 + /root/.ssh + 凭据本体（.aws/.docker/.netrc/.git-credentials）。
      治理依据：spec v1.0.2 §6.3 Tier-1/2 名单分层。
  - id: block-write-sensitive-system-files-command
    name: 阻断通过 shell 重定向写入敏感系统文件（command 维度 · Tier-1）
    enabled: true
    priority: 950
    category: intrusion_defense
    severity: critical
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
      paramsRegex:
        command:
          - '>>?\s*/etc/(passwd|shadow|gshadow|sudoers|cron|init\.d/|systemd/system/)'
          - '>>?\s*/root/\.ssh/'
          - tee\s+(-[a-zA-Z]*\s+)?/etc/(passwd|shadow)
          - sed\s+-i[^|]*\s+/etc/(passwd|shadow)
          - dd\s+[^|\n]{0,80}?of=/etc/(passwd|shadow)
    action:
      decision: block
      blockReason: 通过 shell 重定向写入敏感系统文件已被安全策略阻断
      blockCode: INTRUSION_DEFENSE_WRITE_SENSITIVE_CMD_013
      appealable: true
    testCases:
