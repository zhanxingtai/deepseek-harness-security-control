          params:
            command: echo hello
        expectedDecision: allow
    notes: |
      从 `block-exec-capabilities-manipulation` 拆出（self_protection
      永不降级，所以原规则的写入类保留 block，本规则承担查询类的 warn）。
      setcap/capsh/chcap/setpriv 的写入路径在 `block-exec-capabilities-manipulation`
      仍保持 block。
  - id: self-protection-block-privilege-escalation
    name: 阻止通过权限提升获得 root / SUID / capabilities 后篡改安全监控
    enabled: true
    priority: 1100
    category: intrusion_defense
    severity: critical
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - chmod
        - chown
        - doas
        - sudo
        - newgrp
        - sg
        - nsenter
        - chroot
        - python
        - python3
        - node
      paramsRegex:
        command:
          - \bchmod\b[^&|;\n]{0,40}?(?:\+s|u\+s|g\+s|a\+s|=[ug]\+s|=[ug]s|4[0-7][0-7][0-7]|2[0-7][0-7][0-7]|6[0-7][0-7][0-7])\b
          # chown 必须同时点名监控资产才是自保护场景。「先升 root 再篡改插件文件/
          # 事件日志」才是本规则的目的，裸的 `chown root:root x.sh` 是通用提权，
          # 由 block-exec-privilege-escalation 那一层管。两种参数顺序都覆盖。
          - \bchown\b[^&|;\n]{0,60}?\b(?:root|0)(?::(?:root|0))?\b[^&|;\n]{0,120}?(?:sst-security-control-dsh|security[-_]?monitor|security-events[^\s"']{0,40}\.jsonl|security-policy\.json|cordis\.patch\.ya?ml|process_monitor|dshwatch)
          - \bchown\b[^&|;\n]{0,120}?(?:sst-security-control-dsh|security[-_]?monitor|security-events[^\s"']{0,40}\.jsonl|security-policy\.json|cordis\.patch\.ya?ml|process_monitor|dshwatch)[^&|;\n]{0,60}?\b(?:root|0)(?::(?:root|0))?\b
          - \bdoas\b[^&|;\n]{0,40}?\b(?:sh|bash|zsh|ksh|python|node)\b
          - \b(?:newgrp|sg)\b[^&|;\n]{0,40}?\b(?:wheel|root|shadow|sudo|adm|disk|sys)\b
          - \bsudo\b[^&|;\n]{0,40}?-(?:i|s)\b
          - \bsudo\b[^&|;\n]{0,40}?(?:su|ba|sh|zsh|ksh|python|node)\b
          - \b(python[23]?|node)\b[^&|\n]{0,200}?\b(?:os\.setuid|os\.setgid|os\.setresuid|process\.setuid|process\.setgid|ctypes\.windll\.kernel32\.SetTokenInformation)\b
          # `(?:-t|--target)` 而非原先的 `-(?:t|--target)`：后者展开成 `-t` 或
          # `---target`（三横线），`--target <pid>` 这个最常见的 nsenter 形态
          # 从来没被匹配上。`\s*=?\s*` 覆盖 `-t 1` / `-t1` / `--target=1`。
          - \bnsenter\b[^&|;\n]{0,40}?(?:-t|--target)\s*=?\s*\d+
    action:
      decision: block
      blockReason: 检测到针对安全监控资产的权限提升原语（chmod SUID / chown root / sudo -i / os.setuid / nsenter），是禁用安全监控的典型旁路：先升级到 root，再篡改插件文件或事件日志，已被安全策略阻断
      blockCode: INTRUSION_DEFENSE_PRIVESC_008
      appealable: false
    notes: |
      插件自身保护 — 纵深链规则，priority 1100，与 SELF_PROTECTION_014/015/016/017/018
      同级。差异化定位：
        - block-exec-privilege-escalation (priority 900)：通用 exec 层，覆盖日常 sudo 用法
        - block-exec-capabilities-manipulation (priority 1100)：Linux capabilities 操作
        - self-protection-block-privilege-escalation (priority 1100，本规则)：
          自保护纵深 — 拦截「先升级权限、再篡改插件」的旁路路径
      涵盖的升级原语：chmod SUID/SGID 位 / chown root（须同时点名监控资产）/
      doas / newgrp / sg / sudo -i 交互式 root / 脚本内 os.setuid / nsenter 进命名空间。
      chroot 已拆到 warn-chroot-usage（warn 级）：容器与测试环境常规手法，
      按 block 拦是纯噪声，但保留可见性。
      与 SELF_PROTECTION_016/017 互补：016 拦「写脚本内容含升级原语」，
      本规则拦「直接执行升级原语」。
    testCases:
      - input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: chmod +s /tmp/evil && /tmp/evil
        expectedDecision: block
      - input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: chmod 4755 /bin/cp
        expectedDecision: block
      - input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: chmod u+s /tmp/payload
        expectedDecision: block
      - input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: chown root:root /tmp/evil && chmod +s /tmp/evil
        expectedDecision: block
      - input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: doas bash
        expectedDecision: block
      - input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: newgrp wheel
        expectedDecision: block
      - input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: sg root bash
        expectedDecision: block
      - input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: sudo -i
        expectedDecision: block
      - input:
          actionType: agent_tool_call
          toolName: bash
          params:
