  - id: warn-chroot-usage
    name: chroot 改变根目录（告警级）
    enabled: true
    priority: 1099
    category: intrusion_defense
    severity: medium
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - chroot
        - sudo
        - doas
      paramsRegex:
        command:
          # `(?!-)` 排除 `chroot --help` / `--version`：原式 `\s+\S+` 会把帮助
          # 输出也当成 chroot 用法，那是纯粹的误报。第一个实参必须是路径。
          - \bchroot\b[^&|;\n]{0,80}?\s+(?!-)\S+
    action:
      decision: warn
      message: chroot 改变根目录已被记录：容器逃逸 / 越权读文件的常用前置动作
      blockCode: INTRUSION_DEFENSE_CHROOT_015
      appealable: true
    notes: |
      从 self-protection-block-privilege-escalation 拆出，降 warn。
      chroot 是容器/测试环境的常规手法（`chroot /tmp` 几乎什么都不做，
      `chroot --help` 更是帮助文本），按 block 见一次拦一次是纯噪声；但它
      确实是容器逃逸的前置动作，保留可见性。通用提权信号（chmod SUID /
      sudo -i / os.setuid / nsenter）仍留在 008 硬拦。
      恢复条件：若语料证明 chroot 常被用于逃逸，再评估是否回到 block。
    testCases:
      - name: chroot /opt /bin/sh 触发 warn
        input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: chroot /opt /bin/sh
        expectedDecision: warn
      - name: chroot --help 放行（帮助输出不是 chroot 用法）
        input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: chroot --help
        expectedDecision: allow
      - name: sudo systemctl restart nginx 不命中 chroot 规则
        input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: sudo systemctl restart nginx
        expectedDecision: allow
  - id: block-exec-package-install-from-url
