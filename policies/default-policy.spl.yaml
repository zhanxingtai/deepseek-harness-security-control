  - id: block-sensitive-system-files-warn
    name: 阻断敏感系统文件访问
    enabled: true
    priority: 940
    category: sensitive_data_access
    severity: medium
    match:
      actionType:
        - agent_tool_call
      toolName:
        - file_read
        - read
        - fs.readFile
        - Read
      paramsRegex:
        path:
          - ^/etc/passwd
          # /etc/hosts 已移出：读它是名字解析链的常规动作（每个程序都读）。
          # 删除仍由 block-delete-sensitive-files 硬拦——删掉等于破坏全机解析。
          #
          # ~/.ssh/ 三条也已移出（本条的注释里早就写明「覆盖缺口由
          # block-ssh-private-keys-critical / -warn 承接」，但行一直没删）：
          # 私钥本体 → critical(950)，authorized_keys / known_hosts.d → warn(950)。
          # 留着就是同一路径被两条规则各告警一次，审计里表现为 globalFP 双计，
          # 实测 `/root/.ssh/authorized_keys` 同时命中 SENSITIVE_FILE_004 与
          # SSH_PRIVATE_KEYS_WARN。删掉后覆盖面不变，只是回到单一归属。
          - ^/root/\.npmrc
          - ^/root/\.pypirc
          - ^/root/\.bash_history
          # /etc/ssh/* 可改 PermitRootLogin/AuthorizedKeysFile；/etc/crypttab 是磁盘
          # 加密口令映射；machine-id/boot_id 是机器身份；auth.log、wtmp、btmp、
          # lastlog 是登录审计轨迹。均为横向移动前的标准侦察目标。
          - ^/etc/ssh/ssh_config$
          - ^/etc/ssh/sshd_config$
          - ^/etc/ssh/sshd_config\.d/
          - ^/etc/crypttab$
          - ^/etc/machine-id$
          - ^/proc/sys/kernel/random/boot_id$
          - ^/var/log/auth\.log$
          - ^/var/log/(?:wtmp|btmp|lastlog)$
    action:
      decision: warn
      message: 阻断敏感系统文件访问:命中非 critical 路径,仅记录,工具继续执行
      blockCode: SENSITIVE_DATA_ACCESS_SENSITIVE_FILE_004
      appealable: true
    testCases:
      - name: 读取 /etc/passwd 触发 warn
        input:
          actionType: agent_tool_call
          toolName: file_read
          params:
            path: /etc/passwd
