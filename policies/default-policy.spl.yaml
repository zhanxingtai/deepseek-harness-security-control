    notes: 默认阻断规则 — 拦截已知危险行为。
  - id: block-exec-capabilities-manipulation
    name: 阻断 exec Linux capabilities 操作
    enabled: true
    priority: 1100
    category: self_protection
    severity: critical
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - setcap
        - getcap
        - capsh
        - setpriv
        - pscap
        - getpcaps
        - chcap
      paramsRegex:
        command:
          # === 写入类操作（保留 block，self_protection 永不降级）===
          - \bsetcap\b[\s\S]{0,200}?cap_[\w]+\s*=?\s*[+\-]?[epEP]+\b
          - \bcapsh\b[\s\S]{0,200}?--?(?:add-cap|drop-cap|caps|inh|amb|secure-bits|priv)\b
          - \bchcap\b\s+
          - \bsetpriv\b[\s\S]{0,200}?--inh-caps
          # === 只读查询（getcap/getpcaps/pscap）已移至 warn 规则 ===
          # corpus 把 `getcap /usr/bin/python3` / `getcap -r /` 标为负例（只读不算
          # 攻击），故从 block 拆出到 warn-capabilities-introspection。
    action:
      decision: block
      blockReason: 检测到 Linux capabilities 操作，已被安全策略阻断
      blockCode: SELF_PROTECTION_CAPABILITIES_026
      appealable: false
    testCases:
      - name: setcap 提权触发 block
        input:
          actionType: agent_tool_call
          toolName: exec
          params:
            command: setcap cap_net_bind_service=+ep /usr/bin/python3
        expectedDecision: block
      - name: 普通 ls 不命中
        input:
          actionType: agent_tool_call
          toolName: exec
          params:
            command: ls -la /tmp
        expectedDecision: allow
    notes: |
      2026-09-25: closes the gap that POLICY_EXEC_PRIV_ESC_001
      doesn't cover the capabilities(7) path. `setcap cap_net_bind_service=+ep
      /bin/bash` / `capsh --add-cap` / `getcap /bin/bash` previously fell through
      every existing SPL rule — setcap/capsh are not in any other deny-list
      (chmod +s / sudo chmod +s / etc. all are different).

      Cover surface:
        - setcap with `cap_<name>=<flags>` argument (cap_net_bind_service /
          cap_net_raw / cap_sys_admin / cap_dac_read_search / cap_sys_ptrace /
          cap_dac_override / cap_chown / cap_fowner / cap_fsetid / cap_kill /
          cap_setgid / cap_setuid / cap_setpcap / cap_linux_immutable / ...)
        - capsh with --add-cap / --drop-cap / --caps / --inh / --amb /
          --secure-bits / --priv (any priviledged mode flip)
        - getcap (introspection that pairs with setcap — when the agent
          queries `getcap /usr/bin/python3` it's almost certainly
          preparing an exploit, not auditing)
        - getpcaps / pscap / chcap — same threat profile
        - setpriv --inh-caps (capabilities inheritance)
  - id: warn-capabilities-introspection
    name: 警告 capabilities 只读查询（getcap / getpcaps / pscap）
    category: intrusion_defense
    severity: low
    enabled: true
    priority: 880
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
