  - id: self-protection-block-mutating-plugin-tools
    name: 工具栈层：阻断指向安全监控自身的 install/uninstall/enable/disable/update/patch 类插件工具
    enabled: true
    priority: 1490
    category: self_protection
    severity: critical
    match:
      actionType:
        - agent_tool_call
      toolName:
        - plugin_install
        - plugin_uninstall
        - plugin_disable
        - plugin_enable
        - plugin_update
        - plugin_patch
      # 原先只有 toolName、无内容锚点，等于「调用一次 plugin_* 就 block」：
      # 开源语料里 24 条跨规则误触全部来自 extension_uninstall（卸载/更新任何
      # 扩展都硬拦）。补 name 锚点后，覆盖缺口由既有规则承接——command 形态归
      # self-protection-block-uninstall，path/action 归 -gateway-self-harm-*。
      paramsRegex:
        name:
          - '(?:sst-security-control-dsh|dsh[-_]?security[-_]?monitor|security[-_]?monitor)'
    action:
      decision: block
      blockReason: 对安全监控插件自身的安装 / 卸载 / 启用 / 禁用 / 更新 / 补丁操作已被安全策略阻断
      blockCode: SELF_PROTECTION_GATEWAY_TOOL_036
      appealable: false
    testCases:
      - name: plugin_uninstall 指向监控自身触发 block
        input:
          actionType: agent_tool_call
          toolName: plugin_uninstall
          params:
            name: sst-security-control-dsh
        expectedDecision: block
      - name: plugin_uninstall 指向第三方插件放行（2026-10-21 起不再裸拦）
        input:
          actionType: agent_tool_call
          toolName: plugin_uninstall
          params:
            name: dsh-plugin-code-review
        expectedDecision: allow
      - name: extension_uninstall 指向监控自身由 warn 副轨承接
        input:
          actionType: agent_tool_call
          toolName: extension_uninstall
          params:
            name: security-monitor
