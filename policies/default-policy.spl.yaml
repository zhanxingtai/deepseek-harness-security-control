          - \b(base64|openssl)\b[^&|;\n#]{0,80}?(-d|--decode|-D)\b[^&|;\n#]{0,200}?\|\s*[^&|;\n#]{0,24}?\b(ba|z|da)?sh\b
          - \b(base64|openssl)\b[^&|;\n#]{0,80}?(-d|--decode|-D)\b[^&|;\n#]{0,200}?(ba|z|da)?sh\s+-c\b
          - \b(ba|z|da)?sh\s+-c\b[^&|;\n#]{0,80}?\$\s*\([^&|;\n#]{0,200}?\b(base64|openssl)\b[^&|;\n#]{0,40}?(-d|--decode|-D)\b
          - \b(ba|z|da)?sh\s+-c\b[^&\n#]{0,700}?\b(base64|openssl)\b[^&;|\n#]{0,40}?(-d|--decode|-D)\b
    action:
      decision: block
      blockCode: SELF_PROTECTION_DISABLER_SCRIPT_WRITE_016
      blockReason: 检测到写入脚本包含禁用安全监控的内容；不允许写入可禁用安全监控的脚本。
      appealable: false
    testCases:
