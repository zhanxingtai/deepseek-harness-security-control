        expectedDecision: allow
    notes: |
      治理项：扩展 Tier-2 路径覆盖 .npmrc / .pypirc / .bash_history
      （开发者配置文件），从 block-sensitive-system-files-critical 主轨迁出。
      决策保持 warn（仅记录，工具继续执行），不引入 -critical/-warn 副轨歧义
      （用户原则 3：主轨只走 critical 同威胁拦截；不同威胁独立规则）。
      FP 收窄 :① 降为只读轨(file_read/read/fs.readFile/Read),
      写入面交回各 critical 写规则(block-write-system-* P950),优先级 980→940 消除
      warn 压 block 倒挂;② /root/.ssh/ 排除 *.pub 公钥读取;③ .npmrc/.pypirc/.bash_history
      写入不再告警(开发者配置属正常操作)。
  - id: block-ssh-private-keys-critical
