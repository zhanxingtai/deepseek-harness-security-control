  - id: block-ssh-private-keys-warn
    name: 阻断 SSH 私钥/授权文件访问
    enabled: true
    priority: 930
    category: sensitive_data_access
    severity: medium
    match:
      actionType:
        - agent_tool_call
      toolName:
        - file_read
        - fs.readFile
        - read
        - Read
      paramsRegex:
        path:
          - ^.*/\.ssh/authorized_keys$
          # 移除 known_hosts$ 与 config$：前者是客户端主机指纹表，后者是客户端自己的
          # 连接配置（ProxyJump/IdentityFile/Port），均属日常读取而非凭据访问。
          # 改用 known_hosts\.d/ —— 服务端主机密钥目录，可被植入做中间人。
          - ^.*/\.ssh/known_hosts\.d/
          # sshd 的 per-user 环境文件：可注入 LD_PRELOAD，属授权面一部分
          - ^.*/\.ssh/environment$
          - ^.*/\.ssh/rc$
    action:
      decision: warn
      message: 阻断 SSH 私钥/授权文件访问:命中非 critical 路径,仅记录,工具继续执行
      blockCode: SENSITIVE_DATA_ACCESS_SSH_KEY_006
      appealable: true
    testCases:
      - name: 读取 /home/alice/.ssh/authorized_keys 触发 warn
        input:
          actionType: agent_tool_call
          toolName: file_read
          params:
            path: /home/alice/.ssh/authorized_keys
        expectedDecision: warn
      # known_hosts 是每次 ssh 连接都会读的客户端主机指纹表，收敛后不再告警
      - name: 读取 /home/alice/.ssh/known_hosts 放行（FPR 收敛后不再告警）
        input:
          actionType: agent_tool_call
          toolName: file_read
          params:
            path: /home/alice/.ssh/known_hosts
        expectedDecision: allow
      - name: 读取 /var/log/secure 不命中 SSH 私钥相关规则
        input:
          actionType: agent_tool_call
          toolName: file_read
          params:
            path: /var/log/secure
        expectedDecision: allow
    notes: 默认阻断规则 — 拦截已知危险行为。
  - id: block-read-credentials-critical
    name: 阻断读取凭据/密钥文件
    enabled: true
    priority: 950
    category: sensitive_data_access
    severity: medium
    match:
      actionType:
        - agent_tool_call
      toolName:
        - file_read
        - fs.readFile
        - read
        - Read
      paramsRegex:
        path:
          - ^.*\.(pem|key|crt|p12|pfx)$
          - ^.*k8s/.*config$
          - ^.*kube/config$
    action:
      decision: block
      blockReason: 读取凭据或密钥文件已被安全策略阻断(critical paths)
      blockCode: SENSITIVE_DATA_ACCESS_READ_CREDENTIALS_007
      appealable: true
    testCases:
      - name: 读取 /opt/app/certs/server.pem 触发 critical 阻断
        input:
          actionType: agent_tool_call
          toolName: file_read
          params:
            path: /opt/app/certs/server.pem
        expectedDecision: warn
      - name: 读取 /opt/app/README.md 不命中凭据 critical 规则
        input:
          actionType: agent_tool_call
          toolName: file_read
          params:
            path: /opt/app/README.md
        expectedDecision: allow
    notes: >-
      默认阻断规则 — 拦截已知危险行为。

      误伤面评审 :
      - 命中范围: 任意路径下 .pem/.key/.crt/.p12/.pfx 文件读取 + k8s/kube config 文件读取
      - 已知误伤源: 运维合法查看证书指纹 (`openssl x509 -in …`)、CI 构建产物检查、开发用本地 kubeconfig
        — 这些场景通过 `appealable: true` 走申诉,或在上层加 `allow-*` 规则显式放行 (spec §6.4)
      - 已知不命中: 纯文本配置文件 (.yaml/.toml/.ini)、容器镜像内 /etc/ssl/certs/ 系统证书(未在匹配路径集内)
      - 升级建议: 若实测发现严重误伤,在 rule 维度把 `decision` 降为 `warn`(保留 threat 告警但不阻断),与同层级 `block-read-credentials-warn`
        双轨配合覆盖 Tier-2 凭据 (凭用户原则 1: 宁可降拦截,标记告警)
  - id: block-read-credentials-warn
    name: 阻断读取凭据/密钥文件
    enabled: true
    priority: 930
    category: sensitive_data_access
    severity: medium
    match:
      actionType:
        - agent_tool_call
      toolName:
        - file_read
        - fs.readFile
        - read
        - Read
      paramsRegex:
        path:
          - ^.*\.env(\.|$)
          - ^.*\.env\.example$
          - ^.*\.env\.local$
          - ^.*\.aws/credentials$
          - ^.*\.aws/config$
          - ^.*\.docker/config\.json$
          - ^.*\.git-credentials$
          - ^.*\.netrc$
          - ^.*\.npmrc$
          - ^.*\.pypirc$
          - ^.*\.bash_history$
          - ^.*\.zsh_history$
          # 移除六个 shell 启动文件：读 ~/.bashrc 是看 PATH/alias 的日常动作，
          # ssh/git/编辑器启动也会自己读它，按 warn 见一次响一次是纯噪声。
          # shell 历史保留（.bash_history 确实承载明文口令）。若日后确需盯
          # 启动文件，应另立 shell-startup-file 规则单独定级，不要混进凭据规则。
          # 以下均为凭据承载文件：.cargo/credentials（文件名即凭据）、
          # .m2/settings.xml（<server><password>）、.config/gh/hosts.yml
          # （OAuth token）、.pip/pip.conf（index-url 内嵌口令）、
          # .gitconfig（credential.helper）。
          - ^.*\.cargo/credentials$
          - ^.*\.m2/settings\.xml$
          - ^.*\.config/gh/hosts\.yml$
          - ^.*\.pip/pip\.conf$
          - ^.*\.gitconfig$
    action:
      decision: warn
      message: 阻断读取凭据/密钥文件:命中非 critical 路径,仅记录,工具继续执行
      appealable: true
    testCases:
      - name: 读取 /var/www/app/.env 触发 warn
        input:
          actionType: agent_tool_call
          toolName: file_read
          params:
            path: /var/www/app/.env
        expectedDecision: warn
      - name: 读取 /opt/app/config.yaml 不命中凭据 warn 规则
        input:
          actionType: agent_tool_call
          toolName: file_read
          params:
