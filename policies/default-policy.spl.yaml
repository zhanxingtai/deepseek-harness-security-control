      blockCode: SELF_PROTECTION_ASSET_027
      appealable: false
    testCases:
      - name: asset_change 改 cordis.patch.yml 触发 block
        input:
          actionType: asset_change
          assetType: agent_config
          params:
            asset_path: /root/.dsh/cordis.patch.yml
            content: 'tampered: true'
        expectedDecision: block
      - name: asset_change 改其他资产 allow
        input:
          actionType: asset_change
          assetType: agent_config
