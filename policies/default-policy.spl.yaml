      blockReason: ptrace / gdb attach 到 dsh 引擎 = 旁路 SPL pre-eval，跨进程内存可读写；真实兜底在 seccomp / capability，规则本身只起告警 + 阻断发起作用
      blockCode: SELF_PROTECTION_PTRACE_ATTACH_044
