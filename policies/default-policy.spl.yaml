        - write
        - create
        - edit
      paramsRegex:
        body:
          - /etc/ld\.so\.(?:preload|conf(?:\.d/|\b))
    action:
      decision: block
      blockReason: 检测到写入含 glibc 劫持路径的文件 — 进程级代码注入
      blockCode: SELF_PROTECTION_LDSO_PAYLOAD_049
      appealable: false
    testCases:
      - name: body 含 /etc/ld.so.preload 触发 block
        input:
          actionType: agent_tool_call
          toolName: write
          params:
            body: /etc/ld.so.preload
        expectedDecision: block
      - name: body 含 /etc/ld.so.cache 不命中
        input:
          actionType: agent_tool_call
          toolName: write
          params:
            body: /etc/ld.so.cache
        expectedDecision: allow
    notes: 2026-09-25 P3-C
  - id: self-protection-block-selinux-apparmor-disable
    name: 阻止关闭 SELinux / AppArmor（内核强制访问控制）
    enabled: true
    priority: 1250
    category: self_protection
    severity: critical
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - python
        - python3
        - setenforce
        - aa-complain
        - aa-disable
        - aa-remove
        - semodule
      paramsRegex:
        command:
          - \bsetenforce\s+(?:0|permissive|disabled)\b
          - \b(?:aa-complain|aa-disable|aa-remove)\b[^&|;\n]{0,40}
          - \bsemodule\s+-r\b[^&|;\n]{0,80}
          - \bsystemctl\s+(?:stop|disable|mask)\s+(?:selinux|apparmor)\b
          - \bservice\s+(?:selinux|apparmor)\s+(?:stop|disable|mask)\b
    action:
      decision: block
      blockReason: 检测到关闭 Linux 内核级强制访问控制（SELinux/AppArmor）— 关闭后无后续防御层
      blockCode: SELF_PROTECTION_SELINUX_APPARMOR_DISABLE_050
      appealable: false
    testCases:
      - name: setenforce 0 触发 block
        input:
          actionType: agent_tool_call
          toolName: exec
          params:
            command: setenforce 0
        expectedDecision: block
      - name: getenforce 查询不命中
        input:
          actionType: agent_tool_call
          toolName: exec
          params:
            command: getenforce
        expectedDecision: allow
    notes: 2026-09-25 P3-C
  - id: self-protection-block-firewall-flush
    name: 阻止清空防火墙规则（iptables / nft / ufw）
    enabled: true
    priority: 1250
    category: self_protection
    severity: critical
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - python
        - python3
        - sudo
        - iptables
        - ip6tables
        - nft
        - ufw
        - firewalld-cmd
      paramsRegex:
        command:
          - \biptables(?:-legacy|-nf?table|-nft)?\s+(?:-F|--flush|-X|--delete-chain|-t\s+\S+\s+-F)\b
          - \bip6tables\s+(?:-F|--flush|-X|--delete-chain)\b
          - \bnft\s+(?:flush|delete\s+rule|delete\s+chain|delete\s+table)\b
          - \bufw\s+(?:disable|reset|allow\s+22)\b
          - \bfirewalld-cmd\s+--remove-(?:service|port|interface)\b[^&|;\n]{0,200}?--permanent
    action:
      decision: escalate
      blockReason: 检测到清空防火墙规则 (iptables/nft/ufw) — 抹除网络层防御，依赖宿主侧 nftables 兜底
      blockCode: SELF_PROTECTION_FIREWALL_051
      appealable: true
    testCases:
      - name: iptables -F 清空规则触发 escalate
        input:
          actionType: agent_tool_call
          toolName: iptables
          params:
            command: iptables -F
        expectedDecision: escalate
      - name: iptables -L 列规则不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: iptables
          params:
            command: iptables -L
        expectedDecision: allow
    notes: 2026-09-25 P3-C
  - id: self-protection-block-write-firewall-flush-script
    name: 阻止写入包含防火墙清空脚本的文件
    enabled: true
    priority: 1250
    category: self_protection
    severity: critical
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - write
        - create
        - edit
        - patch
      paramsRegex:
        body:
          - (?:^|\n)[^\n#]{0,4000}\b(?:iptables|nft|ufw|firewalld-cmd)\b[^\n#]{0,200}(?:-F\b|--flush\b|\bflush\b|\bdisable\b|\breset\b|--remove-(?:service|port|interface)(?:=\S+|\s+\S+)?)
    action:
      decision: escalate
      blockReason: 检测到写入脚本包含清空防火墙的代码 (iptables/nft/ufw) — 间接持久化通道
      blockCode: SELF_PROTECTION_FIREWALL_052
      appealable: true
    testCases:
      - name: write 工具 body 含 iptables -F 触发 escalate
        input:
          actionType: agent_tool_call
          toolName: write
          body: |
            #!/bin/bash
            iptables -F
        expectedDecision: escalate
      - name: write 工具 body 是普通脚本不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: write
          body: |
            #!/bin/bash
            echo hello
        expectedDecision: allow
    notes: 2026-09-25 P3-C

  # — 接通 RuntimeHook 已经在 emit 但策略端 0 订阅的两个旗标
  # RuntimeHook 在 pre-spawn seam 检出威胁后推入 ctx.riskFlags,但没有 policy 订阅
  # 意味着这些事件不落 security-events.jsonl,运营/审计看不到。补两条 warn 规则。
  # 注:testCases 用 toolName: pnpm 是为了避开更严规则的工具名列表,让本规则
  # 单独命中,warn 决策不被覆盖。
  - id: warn-unpatched-engine-relaunch
    name: RuntimeHook 检出 dsh 引擎无 --patch security-monitor 重启（自保护旁路告警）
    enabled: true
    priority: 1100
    category: self_protection
    severity: high
    match:
      actionType:
        - agent_tool_call
        - process_start
      riskFlagsAny:
        - unpatched_engine
    action:
      decision: warn
      blockReason: RuntimeHook 在派生 dsh 引擎进程时检出 --patch security-monitor 参数缺失，自保护组件可能未生效
      blockCode: SELF_PROTECTION_UNPATCHED_ENGINE_053
      appealable: true
    testCases:
      - name: RuntimeHook flag unpatched_engine 触发 warn
        input:
          actionType: process_start
          toolName: pnpm
          riskFlags:
            - unpatched_engine
          params:
            command: pnpm dsh web
        expectedDecision: warn
      - name: 携带其他旗标但不命中 unpatched_engine (普通 pnpm 命令也不会被 self-protection-block-restart-without-patch 命中)
        input:
          actionType: process_start
          toolName: pnpm
          riskFlags:
            - reverse_shell
          params:
            command: pnpm install
        expectedDecision: allow
    notes: 2026-10-10 接通 RuntimeHook.deriveRiskFlags() 已 emit 的 unpatched_engine 旗标

  - id: warn-scratch-dir-spawn
    name: RuntimeHook 检出在临时目录（/tmp /var/tmp /dev/shm）派生进程
    enabled: true
    priority: 850
    category: intrusion_defense
    severity: medium
    match:
      actionType:
        - agent_tool_call
        - process_start
      riskFlagsAny:
        - scratch_dir_spawn
    action:
      decision: warn
      blockReason: RuntimeHook 检出在临时目录派生进程（/tmp /var/tmp /dev/shm），常用于脚本间接执行绕过
      blockCode: INTRUSION_DEFENSE_SCRATCH_DIR_SPAWN_014
      appealable: true
    testCases:
      - name: RuntimeHook flag scratch_dir_spawn 触发 warn (pnpm 工具名避开更严规则的 toolName 列表)
        input:
          actionType: process_start
          toolName: pnpm
          riskFlags:
            - scratch_dir_spawn
          params:
            command: pnpm install
        expectedDecision: warn
      - name: 携带其他旗标但不命中 scratch_dir_spawn
        input:
          actionType: process_start
          toolName: pnpm
          riskFlags:
            - reverse_shell
          params:
            command: pnpm install
        expectedDecision: allow
    notes: 2026-10-10 接通 RuntimeHook.deriveRiskFlags() 已 emit 的 scratch_dir_spawn 旗标
