  - id: self-protection-asset-tamper-patch
    name: 资产层：cordis.patch.yml 被修改/删除（兜底非工具路径）
    # 停用：asset_change / asset_remove 在本仓没有运行时生产者，
    # 规则永远不会触发。停用前它们在 pnpm test / pnpm verify / SPL 审计里
    # 全绿——因为测试与语料自己伪造了 asset_change 事件喂进去。
    # 详见 self-protection-asset-tamper-patch 的 notes。
    # 恢复条件：重新引入能 emit asset_change 的采集器后改回 true；
    # scripts/verify-action-type-producers.mjs 会守住这条线。
    enabled: false
    priority: 1500
    category: self_protection
    severity: critical
