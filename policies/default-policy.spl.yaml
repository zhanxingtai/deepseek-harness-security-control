      paramsRegex:
        # id_dsa / id_ecdsa 是从 `block-sensitive-system-files-warn` 接手过来的
        # ——那边只覆盖 `/root/` 前缀，这里覆盖任意家目录。必须用 `$` 而非 `\b`
