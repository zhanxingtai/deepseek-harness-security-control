      appealable: false
    notes: 阻止对 sst-security-control-dsh 进程树的 kill / pkill / fuser / Stop-Process 操作。2026-10-10 FP 收窄+门控补齐(宁漏勿误):kill+$var 形态排除 `kill -0`(存活探测是良性习惯用法);toolName 补 cmd/cmd.exe(Windows 宿主经 cmd 调 taskkill 此前失防)。
