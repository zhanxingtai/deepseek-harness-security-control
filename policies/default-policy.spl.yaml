  - id: block-credential-in-command-critical
    name: 命令行包含明文凭据（critical commands,FP 收窄）
    enabled: true
    priority: 850
    category: data_leak_monitoring
    severity: medium
    match:
      actionType:
        - process_start
        - agent_tool_call
      paramsRegex:
        command:
          - (?<![A-Za-z0-9_])(?!.*(?:password|secret|pwd|token|key)\s*[:=]\s*(?:test|example|placeholder|dummy|changeme|redacted|xxxx+)\b)(?:Authorization|X-Api-Key|Api[_-]?Key|access[_-]?token|secret|password|passwd|pwd)[\s=:]+['"]?[A-Za-z0-9_\-\.~+\/=]{16,}
          - Bearer[\s=]+[A-Za-z0-9_\-\.=]{24,}
          - (?:mysql|psql|mongosh)(?:\s+[\s\S]{0,80}?)?\s-p(?=\S)\S+
          - redis-cli\s+[\s\S]{0,80}?-a(?:\s|\=)\S+
          - ssh\s+.*-i\s+/root/|\.ssh/id_(?![^/\s"']*\.pub)
    action:
      decision: block
      blockReason: 命令行包含明文凭据，已被安全策略阻断，请使用密钥管理服务(critical commands)
      blockCode: DATA_LEAK_MONITORING_CREDENTIAL_CMD_001
      appealable: true
    testCases:
      - name: mysql -u root -p 粘附密码触发 warn(severity=medium 降级 issue
        input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: mysql -u root -pMySecretPass123 -h db.internal mydb
        expectedDecision: warn
      - name: curl -H password= 长凭据触发 warn(>16 字符,severity=medium 降级)
        input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: curl -H 'password=VeryLongSecret123456' https://example.com/api
        expectedDecision: warn
      - name: redis-cli -a 明文密码触发 warn(severity=medium 降级)
        input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: redis-cli -a MyRedisPass123 ping
        expectedDecision: warn
      - name: Bearer 长 token 触发 warn(≥24 字符,severity=medium 降级)
        input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: 'curl -H "Authorization: Bearer abc123def456ghi789jkl012mno" https://api.example.com'
        expectedDecision: warn
      - name: ssh -i ~/.ssh/id_rsa 触发 warn(severity=medium 降级)
        input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: ssh -i ~/.ssh/id_rsa user@host.internal
        expectedDecision: warn
      - name: psql -h db.internal -p 5432 端口 allow(Pattern 3 收紧)
        input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: psql -h db.internal -p 5432 -U postgres mydb
        expectedDecision: allow
      - name: mysql --port=3306 -u root allow(端口而非密码)
        input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: mysql --port=3306 -u root mydb
        expectedDecision: allow
      - name: DATABASE_PASSWORD= 长值 env var allow(Pattern 1 lookbehind 拒绝左侧声明)
        input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: DATABASE_PASSWORD=VeryLongSecret123456 echo ok
        expectedDecision: allow
      - name: Bearer 短 token allow(<24 字符)
        input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: 'curl -H "Authorization: Bearer abc123def456" https://api.example.com'
        expectedDecision: allow
      - name: password= 短值 allow(<16 字符)
        input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: curl -H 'password=short' https://api.example.com
        expectedDecision: allow
      - name: 普通 mysql 查询(无 -p 密码)allow
        input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: mysql -u root -h db.internal -e "SELECT 1"
        expectedDecision: allow
    notes: >-
      默认阻断规则 — 拦截已知危险行为。P2 FP 收窄：Pattern 1 加 (?<![A-Za-z0-9_]) lookbehind 阻止 env-var 左侧声明 DATABASE_PASSWORD=
      误命中; 最小凭据长度 12→16 降低短凭据误判风险; Pattern 2 Bearer 最小长度 12→24 过滤短 JWT 在 API 调用中的合法误命中; Pattern 3 -p flag
      收紧为粘附形态(-pmypass) 排除 -p PORT(端口)误拦 psql/mysql 连接; Pattern 4 ssh -i 路径保持原行为。

      误伤面评审 :
      - 命中范围: 命令行包含 Authorization/X-Api-Key/secret/password/passwd/pwd 键且 ≥16 字符明文;
        Bearer token ≥24 字符; mysql/psql/mongosh -p<粘附密码>; redis-cli -a <密码>; ssh -i 私钥路径
      - 已知误伤源: 短 API token (e.g. GitHub PAT 长度 ≥40 字符通常命中, 短凭据可能漏);
        端口混淆的 <码>-p 80 (端口) 已被 Pattern 3 收紧排除; env-var 左侧声明 DATABASE_PASSWORD=xxx
        已被 Pattern 1 lookbehind 排除
      - 已知不命中: 单引号/双引号包住的 placeholder 关键词 (test/example/placeholder/dummy/changeme/redacted/xxxx+);
        短凭据 (<16 字符); Bearer 短 token (<24 字符); psql/mysql 连接未粘附密码形式
      - 升级建议: 若实测发现严重误伤,在 rule 维度把 `decision` 降为 `warn`(威胁告警保留); 配置依赖
        `*.test` / `*.example` placeholder 关键词加白名单条目
  - id: block-credential-in-command-warn
    name: 命令行包含明文凭据
    enabled: true
    priority: 830
    category: data_leak_monitoring
    severity: medium
    match:
      actionType:
        - process_start
        - agent_tool_call
      paramsRegex:
        command:
          - -u\s+\S+:\S+
          # 补的是云厂商/SaaS 固定 token 前缀（AKIA/ASIA+16、gh?_ +36、xox[baprs]-、
          # sk-、AIza+35），格式本身可判，无阈值。网络轨 redact-credentials-exfil
          # 已用同样的 AKIA 形态，这里补的是命令轨，两轨此前不重合。
          #
          # **刻意不加** `VAR=<长值>` 形态（AWS_SECRET_ACCESS_KEY=xxx 等）：critical
          # 轨的凭据名交替带 (?<![A-Za-z0-9_]) 前瞻，正是为了让
          # `DATABASE_PASSWORD=<值> echo ok` 这类临时注入环境变量的常见开发写法
          # 落到 allow。曾补过该形态，pnpm test 顶红后回退。代价是 SCREAMING_SNAKE
          # 写法的云凭据确实漏——是否付这个误报代价是策略口径问题，不在枚举修复里改。
          - \b(?:AKIA|ASIA)[0-9A-Z]{16}\b
          - \bgh[pousr]_[A-Za-z0-9]{36,}\b
          - \bxox[baprs]-[A-Za-z0-9-]{12,}\b
          - \bsk-(?:proj-)?[A-Za-z0-9_-]{24,}\b
          - \bAIza[0-9A-Za-z_-]{35}\b
    action:
      decision: warn
      message: 命令行包含明文凭据:命中非 critical 命令,仅记录,工具继续执行
      blockCode: DATA_LEAK_MONITORING_CREDENTIAL_CMD_002
      appealable: true
    testCases:
      - name: curl -u user:pass 凭据触发 warn
        input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: curl -u admin:secretpass https://api.example.com/data
        expectedDecision: warn
      - name: 普通 curl 不含 -u user:pass 不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: curl -s https://api.example.com/health
        expectedDecision: allow
    notes: 默认阻断规则 — 拦截已知危险行为。
  - id: block-delete-sensitive-files
    name: 阻断删除 SSH 私钥本体与关键凭据文件（Tier-1）
    enabled: true
    priority: 950
    category: intrusion_defense
    severity: critical
    match:
      actionType:
        - agent_tool_call
      toolName:
        - delete
        - remove
        - rm
        - file_delete
        - Delete
        - Remove
      paramsRegex:
        path:
          - ^/etc/passwd
          - ^/etc/shadow
          - ^/etc/sudoers
          - ^/etc/gshadow
          - ^/etc/hosts
          # 与 block-sensitive-system-files-warn 同步收窄：原 `^/root/\.ssh/` 覆盖
          # ~/.ssh 下的一切，写/删 known_hosts、config 这类日常文件会被硬拦。
          # 只保留私钥本体、授权密钥表、服务端主机密钥目录。必须用 `$` 而非
          # `\b` 收尾（`.pub` 后是非单词字符，`\b` 会把公钥当私钥拦下）。
          - ^/root/\.ssh/id_(?:rsa|dsa|ecdsa|ed25519)$
          - ^/root/\.ssh/authorized_keys$
          - ^/root/\.ssh/known_hosts\.d/
          - ^/root/\.aws/
          - ^/root/\.docker/
          - ^/root/\.netrc
          - ^/root/\.git-credentials
          - ^C:\\Windows\\System32\\
    action:
      decision: block
      blockReason: 删除敏感系统文件或用户关键数据已被安全策略阻断
      blockCode: INTRUSION_DEFENSE_DELETE_SENSITIVE_009
      appealable: true
    testCases:
      - name: rm /tmp/cache 合法不命中(负向)
        input:
          actionType: agent_tool_call
          toolName: rm
          params:
            path: /tmp/cache/file.txt
        expectedDecision: allow
      - name: rm 相对路径合法不命中(负向)
        input:
          actionType: agent_tool_call
          toolName: rm
          params:
            path: ./build
        expectedDecision: allow
      - name: rm /root/.cache/x.log 不命中（移除过宽 /root/ 命中）
        input:
          actionType: agent_tool_call
          toolName: rm
          params:
            path: /root/.cache/test.log
        expectedDecision: allow
      - name: rm /home/alice/.npmrc 不命中（移除过宽 /home/*/. 命中）
        input:
          actionType: agent_tool_call
          toolName: rm
          params:
            path: /home/alice/.npmrc
        expectedDecision: allow
      - name: 删除 /etc/passwd 触发 block
        input:
          actionType: agent_tool_call
          toolName: rm
          params:
            path: /etc/passwd
        expectedDecision: block
      - name: 删除 /root/.ssh/id_rsa 触发 block（Tier-1 保留）
        input:
          actionType: agent_tool_call
          toolName: rm
          params:
            path: /root/.ssh/id_rsa
        expectedDecision: block
      - name: 删除 /root/.aws/credentials 触发 block（Tier-1 凭据本体）
        input:
          actionType: agent_tool_call
          toolName: rm
          params:
            path: /root/.aws/credentials
        expectedDecision: block
    notes: |
      同步项（同款收窄）：
      移除 `^/root/` 与 `^/home/[^/]+/\.` 过宽命中（开发者 rm /root/.cache/x.log 与
      rm /home/alice/.npmrc 触发误拦）。
      保留 Tier-1 名单：/etc 系统文件 + /root/.ssh 凭据本体 + /root/.aws / .docker
      / .netrc / .git-credentials 凭据本体（与 spec §6.3 Tier-1 一致）。
      治理依据：spec §6.3 Tier-1 名单制收窄参考。
  - id: block-write-system-backdoor-critical
