        - shell
        - sh
        - exec
        - execute
        - run_command
        - getcap
        - pscap
        - getpcaps
      paramsRegex:
        command:
          - \bgetcap\b[\s\S]{0,80}?(?:-r[a-zA-Z]*\s+|\s+/)
          - \bgetpcaps?\b\s+\d+
          - \bpscap\b\s*
    action:
      decision: warn
      message: 通过 exec 查询 capabilities 是 setcap 前置（warn，仅记录，可申诉）
      blockCode: INTRUSION_DEFENSE_CAPABILITIES_INTROSPECTION_027
      appealable: true
    testCases:
