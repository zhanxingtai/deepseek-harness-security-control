apiVersion: security.use/v2
kind: Policy
metadata:
  id: sst-security-control-dsh
  name: sst-security-control-dsh 默认策略
  version: 2.1.0
  description: >
    sst-security-control-dsh 应用层干预默认策略。

    SPL v2: 顶层 `category:` 字段 80/80 覆盖（spec §7.2 八值枚举），

    按用户原则归类 — self_protection 只给 match 锚定插件自身的规则，

    通用攻击原语一律 intrusion_defense。supply_chain 类有

    block-exec-package-install-from-url 一条；behavior_guidance /

    data_desensitization 两类零覆盖明确裁决（无对应规则不补）。

    evaluate 区段保留（risk_score 聚合依赖），severity 顶层化保持一致。

    决策与匹配语义：详见各规则 `notes` /

    `testCases` 字段。`paramsNotRegex` 改用 regex 内联

    负向前瞻 (?!...) 等价实现（避免零宽回溯绕过，参考

    DATA_LEAK_DB_LIVE_001 的 `[=\s]` 强制单字符分隔修复）。
  source: builtin
scope:
  platforms:
    - sst-security-control-dsh
  agents:
    - '*'
  tenants:
    - '*'
mode: enforce
resources: {}
rules:
  - id: self-protection-block-uninstall
    name: 阻止卸载或禁用安全监控插件
    enabled: true
    priority: 1100
    category: self_protection
    severity: critical
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - python
        - node
        - plugin
        - plugin_uninstall
        - manage_plugin
        - pnpm
        - npm
        - yarn
        - dsh
        - pwsh
        - powershell
        - powershell.exe
        - cmd
      paramsRegex:
        command:
          - \b(npm|yarn|pnpm)\s+(uninstall|remove|rm)\b.*(sst-security-control-dsh|security-monitor)
          - \bdsh\s+(plugins?|extensions?)\s+(uninstall|remove|disable|delete)\b.*dsh[-_]?security[-_]?monitor
          - \brm\s+(-[a-zA-Z]*\s+)?\S*sst-security-control-dsh(\s|$)
          - \brmdir\s+\S*sst-security-control-dsh
          - \b(mv|chmod|chown)\s+.*sst-security-control-dsh
    action:
      decision: block
      blockReason: 该操作会禁用或卸载安全监控插件，已被安全策略阻断
      blockCode: SELF_PROTECTION_UNINSTALL_001
      appealable: false
    testCases:
      - name: npm uninstall sst-security-control-dsh 触发 block
        input:
          actionType: agent_tool_call
          toolName: npm
          params:
            command: npm uninstall sst-security-control-dsh
        expectedDecision: block
      - name: npm uninstall 其他包 allow
        input:
          actionType: agent_tool_call
          toolName: npm
          params:
            command: npm uninstall lodash
        expectedDecision: allow
      # — Windows pwsh parity: DSH dispatches shell commands via
      # the pwsh tool on Windows; without this case the toolName gap that
      # allowed the real uninstall bypass stays test-invisible.
      - name: pwsh 执行 npm uninstall sst-security-control-dsh 触发 block (Windows 绕过回归)
        input:
          actionType: agent_tool_call
          toolName: pwsh
          params:
            command: npm uninstall sst-security-control-dsh
        expectedDecision: block
      - name: powershell 执行 pnpm remove security-monitor 触发 block (Windows 绕过回归)
        input:
          actionType: agent_tool_call
          toolName: powershell
          params:
            command: pnpm remove sst-security-control-dsh
        expectedDecision: block
    notes: 阻止对 sst-security-control-dsh 自身的卸载 / 禁用 / 删除操作。
  - id: self-protection-block-installer-uninstall
    name: 阻止通过安装脚本执行卸载/清理
    enabled: true
    priority: 1150
    category: self_protection
    severity: critical
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - python
        - python3
        - pwsh
        - powershell
        - powershell.exe
        - cmd
      paramsRegex:
        command:
          - \b(bash|sh|python3?|node)\s+\S*install\.sh\s+.*--(uninstall|cleanup|remove|purge)
          - \./install\.sh\s+.*--(uninstall|cleanup|remove|purge)
          - \b(bash|sh)\s+\S*install\.sh.*\buninstall\b
    action:
      decision: block
      blockReason: 执行安装脚本的卸载/清理路径会禁用安全监控插件，已被安全策略阻断
      blockCode: SELF_PROTECTION_INSTALLER_UNINSTALL_010
      appealable: false
    testCases:
      - name: bash install.sh --uninstall 触发 block
        input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: bash install.sh --uninstall
        expectedDecision: block
      - name: bash install.sh --install allow
        input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: bash install.sh
        expectedDecision: allow
      - name: python3 install.sh --remove 触发 block(2026-10-10 门控补齐:toolName 补 python/python3)
        input:
          actionType: agent_tool_call
          toolName: python3
          params:
            command: python3 install.sh --remove
        expectedDecision: block
    notes: 阻止对 sst-security-control-dsh 自身的卸载 / 禁用 / 删除操作。
  - id: self-protection-block-audit-file-mutation-command
    name: 阻止通过命令删除/截断审计日志或策略文件
    enabled: true
    priority: 1150
    category: self_protection
    severity: critical
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - python
        - python3
        - pwsh
        - powershell
        - powershell.exe
        - cmd
      paramsRegex:
        command:
          - \b(rm|unlink|rmdir|touch|truncate|shred)\s+(-[a-zA-Z]*\s+)?\S*(security-events|security-policy)
          - \bfind\s+\S+\s*-name\s+\S*security-events\S*\s+-delete\b
          - (os\.|shutil\.|pathlib\.)?(remove|unlink|rmdir|rmtree)\s*\(\s*['"]\S*(security-events|security-policy)
          - '>\s*/root/\.dsh/(security-events|security-policy)|tee\s+\S*(security-events|security-policy)'
          - \bpathlib\.Path\s*\(\s*['"]\S*(security-events|security-policy)[\w./-]*['"]?\s*\)
          - \bopen\s*\(\s*['"]\S*(security-events|security-policy)[\w./-]*['"]?\s*,\s*['"][wa]['"]
    action:
      decision: block
      blockReason: 删除或截断审计日志/策略文件会被视为篡改证据，已被安全策略阻断
      blockCode: SELF_PROTECTION_AUDIT_MUTATION_011
      appealable: false
    testCases:
      - name: rm ~/.dsh/security-events.jsonl 触发 block
        input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: rm /root/.dsh/security-events.jsonl
        expectedDecision: block
      - name: rm 其他文件 allow
        input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: rm /tmp/cache.txt
        expectedDecision: allow
    notes: 插件自身保护 — 纵深链规则,priority 1200。
  - id: self-protection-allow-package-manager-mention
    name: 允许包管理工具调用中提及 sst-security-control-dsh 路径
    enabled: true
    priority: 920
    severity: low
    category: self_protection
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - pnpm
        - npm
        - yarn
        - pnpx
        - npx
        - install
        - package_install
        - exec
        - shell
      paramsRegex:
        command:
          - (node_modules[/\\][^\s]*sst-security-control-dsh)
    action:
      decision: allow
      message: 包管理工具调用中提及 sst-security-control-dsh node_modules 路径,allow
      appealable: false
    testCases:
      - name: pnpm install 提及 sst-security-control-dsh node_modules 路径允许
        input:
          actionType: agent_tool_call
          toolName: pnpm
          params:
            command: pnpm install node_modules/sst-security-control-dsh/build/hook.js
        expectedDecision: allow
    notes: 插件自身保护 — 纵深链规则,priority 1200。
  - id: self-protection-block-command-mentioning-plugin-path
    name: 阻止命令中出现安全监控插件资产路径（路径提及式阻断）
    enabled: true
    priority: 900
    category: self_protection
    severity: critical
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - python
        - python3
        - node
        - awk
        - perl
        - ruby
        - pwsh
        - powershell
        - powershell.exe
        - cmd
      paramsRegex:
        command:
          - (security-monitor\.patch|security-events[^\s"']{0,40}\.jsonl|security-policy\.json)
          - (node_modules[/\\][^\s]*sst-security-control-dsh)
          - (\S*/sst-security-control-dsh/(dist|src|policies|lib)[^\s]*)
    action:
      decision: block
      blockReason: 命令中提及安全监控插件配置/数据路径可能用于读取、篡改或规避审计，已被安全策略阻断
      blockCode: SELF_PROTECTION_PLUGIN_PATH_MENTION_012
      appealable: false
    testCases:
      - name: pnpm install 提及 sst-security-control-dsh 触发 whitelist allow
        input:
          actionType: agent_tool_call
          toolName: exec
          params:
            command: pnpm install /opt/dsh/node_modules/sst-security-control-dsh
        expectedDecision: allow
      - name: npm install 提及 sst-security-control-dsh allow
        input:
          actionType: agent_tool_call
          toolName: exec
          params:
            command: npm install /opt/app/node_modules/sst-security-control-dsh
        expectedDecision: allow
      - name: 非包管理器 shell 提及 plugin 路径仍 block(兜底)
        input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: cat /opt/dsh/node_modules/sst-security-control-dsh/lib/index.js
        expectedDecision: block
    notes: 插件自身保护 — 纵深链规则,priority 1200。
  - id: self-protection-block-message-mentioning-plugin-path
    name: 阻止消息中要求读取/删除/篡改安全监控插件资产路径（消息提及式阻断）
    enabled: true
    # 1050：压在同轨 uninstall-message(1100) 之下、命令轨(900) 之上。
    # 卸载消息同时命中两条，应归更具体的 uninstall-message。
    priority: 1050
    category: self_protection
    severity: critical
    match:
      actionType:
        - agent_message
      # 不声明 toolName：agent_message 不带该字段，声明会被 matchToolName 判否。
      # bodyRegex 是严格门，故本规则只挂消息轨；不能与命令轨
      # command-mentioning-plugin-path 合并（会让它在纯 tool_call 上整体失效）。
      # 锚点只认插件资产身份，不锚裸 /opt/dsh（所有插件的公共父目录）。
      bodyRegex:
        - (删除|移除|清理|卸载|篡改|读取|查看|列出|改写|重命名|移动|禁用|停用).{0,25}?(sst-security-control-dsh|security-monitor|security-events[^\s"']{0,40}\.jsonl|security-policy\.json)
        - \b(remove|delete|purge|rename|move|cat|view|list|read|ls|dir|tree|touch|chmod|chown|edit|overwrite|disable|drop)\b.{0,40}?(sst-security-control-dsh|security-monitor|security-events[^\s"']{0,40}\.jsonl|security-policy\.json)
    action:
      decision: block
      blockReason: 消息中要求对安全监控插件资产路径执行读取/删除/篡改操作，已被安全策略阻断
      blockCode: SELF_PROTECTION_PLUGIN_PATH_MESSAGE_009
      appealable: false
    testCases:
      - name: 消息要求删除插件目录触发 block
        input:
          actionType: agent_message
          body: delete /opt/dsh/security-monitor 这个目录
        expectedDecision: block
      - name: 消息要求读取插件审计数据触发 block
        input:
          actionType: agent_message
          body: cat /root/.dsh/security-events.jsonl 给我看下
        expectedDecision: block
      - name: 列举插件公共父目录 /opt/dsh 不命中（负向）
        input:
          actionType: agent_message
          body: 请查看 /opt/dsh 目录内容
        expectedDecision: allow
      - name: 普通删除请求不含插件路径不命中（负向）
        input:
          actionType: agent_message
          body: remove the cache now
        expectedDecision: allow
    notes: |
      插件自身保护 — 消息轨（agent_message）。与命令轨
      self-protection-block-command-mentioning-plugin-path 分立：两条规则的
      载体字段不同（body vs params.command），合并会让 bodyRegex 的严格门
      反向掐死 tool_call 轨。
      新增：此前 agent_message 轨完全无覆盖，语料里 10 条
      agent_message 正例全部记在命令轨名下形成漏报。
      已知不覆盖：纯疑问句（如「/opt/dsh/sst-security-control-dsh 是哪里？」）
      无动词前缀，不属操作请求，不拦。
  - id: self-protection-block-script-write-touching-plugin
    name: 阻止写入内容涉及卸载/篡改插件的脚本
    enabled: true
    priority: 1150
    category: self_protection
    severity: critical
    match:
      actionType:
        - agent_tool_call
      toolName:
        - write
        - Write
        - file_write
        - edit
        - Edit
        - patch_file
        - str_replace
        - multi_edit
        - fs.writeFile
      paramsRegex:
        body:
          - (?:^|\n)[^\n#]{0,12000}\b(security-events|security-policy|security-monitor|sst-security-control-dsh)\b[^\n#]{0,200}\b(remove|unlink|rmdir|delete|uninstall|shutil\.rmtree|rm|mv|rename|chmod|chown|truncate)\b
          - (?:^|\n)[^\n#]{0,12000}\b(remove|unlink|rmdir|delete|uninstall|shutil\.rmtree|rm|mv|rename|chmod|chown|truncate)\b[^\n#]{0,200}\b(security-events|security-policy|security-monitor|sst-security-control-dsh)\b
    action:
      decision: block
      blockReason: 写入内容涉及移除或篡改安全监控插件的可执行脚本，已被安全策略阻断
      blockCode: SELF_PROTECTION_PLUGIN_SCRIPT_WRITE_013
      appealable: false
    testCases:
      - name: 写脚本含 rm security-events 触发 block
        input:
          actionType: agent_tool_call
          toolName: write
          params:
            path: /tmp/disabler.sh
            body: |-
              #!/bin/bash
              rm /root/.dsh/security-events.jsonl
        expectedDecision: block
      - name: 写脚本不触及 plugin 路径 allow
        input:
          actionType: agent_tool_call
          toolName: write
          params:
            path: /tmp/cleanup.sh
            body: |-
              #!/bin/bash
              rm /tmp/cache.txt
        expectedDecision: allow
    notes: |
      阻止对 sst-security-control-dsh 自身的卸载 / 禁用 / 删除操作。
      2026-09-24 P2 收紧：`[^\n#]*` 排除注释行内的关键词。
      补两处枚举洞：
        1) 资产锚点原为 `security-monitor\.patch`（只锚补丁文件），裸的
           `security-monitor` 插件目录不在内，于是
           `rm -rf /opt/dsh/plugins/security-monitor` 整类漏掉。改锚
           `security-monitor` 后，`.patch` 形态由 `\b` 自然覆盖。
        2) 动词表补 mv/rename/chmod/chown/truncate —— 移走、改权限、截断
           都是对插件资产的破坏，与 rm 同级，不该只拦删除。
      已知仍不覆盖：只写不改（`echo x > .../security-monitor/y`）不在动词表内。
      那属 `self-protection-path-guard-toolcall` 按 path 拦的范畴，且加进本规则
      会显著放大命中面，暂不在此收。
  - id: self-protection-block-harness-process-kill
    name: 阻止通过 kill/pkill 终止 dsh 引擎进程（禁用监控的旁路）
    enabled: true
    priority: 1200
    category: self_protection
    severity: critical
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - python
        - python3
        - node
        - pkill
        - killall
        - pkillall
        - taskkill
        - fuser
        - pwsh
        - powershell
        - powershell.exe
        - cmd
        - cmd.exe
      paramsRegex:
        command:
          # 监控/引擎标识的完整名单放在最长匹配这条：中间的 `[^&|;]{0,120}?`
          # 已吃掉信号位与 -f，`killall -9 security-monitor`、
          # `pkill -f sst-security-control-dsh`、`taskkill /F /IM dsh.exe`
          # 三种写法共用它。名单不全时 `killall -9 <monitor>` 会从
          # self-protection 与 block-exec-process-termination-warn 之间漏过去
          # ——2026-10-21 收窄后者时实测漏了 `killall -9 security-monitor`
          # 与 `killall -9 sst-security-control-dsh` 两条。
          - \b(pkill|killall|pkillall|taskkill)\b[^&|;]{0,120}?(bin\.ts|pnpm\s+dsh|dsh\s+web|deepseek-harness|security[-_]?monitor|sst-security-control-dsh)
          - \bkill\b[^&|;]{0,120}?\b(bin\.ts|pnpm\s+dsh|dsh\s+web|deepseek-harness|security[-_]?monitor|sst-security-control-dsh)\b
          - \bkill\b(?!\s+-0\b)[^&|;\n]{0,24}?\$[a-zA-Z_][a-zA-Z0-9_]*\b
          - \bkill\b(?!\s+-0\b)[^&|;\n]{0,24}?\$\{[a-zA-Z_][a-zA-Z0-9_]*\}
          # 本规则只保留命令行里明确出现引擎/监控标识的形态。通用目标
          # （裸 PID、dev server 重启）已移出 block，由
          # block-exec-process-termination-warn 承接。
          - \b(?:pkill|pkillall|killall)\s+(?:dsh|deepseek-harness|security-monitor|sst-security-control-dsh)\b
          - \btaskkill\b[^&|;\n]{0,40}?/PID\s+\d+
          - \bkill\b[^&|;\n]{0,24}?\$\(\s*(?:pidof|pgrep)\b[^)]*?(?:dsh|deepseek-harness|security-monitor|sst-security-control-dsh|cordis\.patch\.ya?ml|process_monitor|dshwatch)
          - \bfuser\b[^&|;\n]{0,80}?-(k[a-zA-Z]*|--kill)\b
          - \b(pkill|pgrep|pkillall)\b[^&|;\n]{0,40}?-f\b[^&|;\n]{0,80}?(security-monitor|sst-security-control-dsh|cordis\.patch\.ya?ml|process_monitor|dshwatch)
          # `pkill -f dsh` 这类「用 -f 按引擎短名过滤」的形态此前落在缝里：
          # 上一行的 -f 分支只认全包名，直接参数分支（`pkill dsh`）又不吃 -f。
          # 2026-10-21 收窄 block-exec-process-termination-warn（撤掉通用
          # `^\s*pkill\s+`）时这个缺口才暴露，verify-self-protection 的 03-pkill
          # 就是它。短名只认前面是空白/路径分隔/引号/等号，`my-dsh-wrapper`
          # 这类无关进程名不会误伤。
          - \b(?:pkill|pkillall|killall)\b[^&|;\n]{0,40}?-f\b[^&|;\n]{0,80}?[\s/="'`]dsh\b
          - \b(python[23]?|node)\b[^&|\n]{0,200}?\b(os\.kill|process\.kill|ctypes\.windll\.kernel32\.TerminateProcess|win32api\.TerminateProcess)\b
          - \bStop-Process\b[^&|;\n]{0,40}?-Id\s+\d+
          - \bStop-Process\b[^&|;\n]{0,40}?-(?:Name|ProcessName)\s+(?:pnpm|node|nodejs|npm|npx|tsx|ts-node|dsh|sst-security-control-dsh)\b
          - \bStop-Process\b[^&|;\n]{0,120}?(bin\.ts|pnpm\s+dsh|dsh\s+web|deepseek-harness|security-monitor)
          - \bGet-Process\b[^&|;\n]{0,40}?(?:pnpm|node|nodejs|npm|npx|tsx|ts-node|dsh|sst-security-control-dsh)\b[^&|;\n]{0,40}?\|\s*[^&|;\n]{0,40}?Stop-Process
          - \bStop-Service\b[^&|;\n]{0,40}?-Name\s+(?:sst-security-control-dsh|dsh|deepseek-harness|security-monitor)
      # dev server（node/npm/pnpm/tsx/ts-node）重启属标准动作，POSIX 与 Windows
      # 须同进同退；引擎/监控标识不在白名单内，自保护语义不变。
      paramsNotRegex:
        command:
          # 前导负向断言保证白名单只在命令未点名引擎/监控时生效：
          # 直接写 `\b(pnpm|node…)\b` 会把 `pkill -f "pnpm dsh web"` 一并豁免。
          # `[\s\S]` 而非 `.`：命令可能含换行，`.` 会留下绕过口。
          - '^(?![\s\S]*\b(?:sst-security-control-dsh|dsh|deepseek-harness|security[-_]?monitor)\b)[\s\S]*\b(node|nodejs|npm|npx|pnpm|yarn|bun|tsx|ts-node)\b'
    action:
      decision: block
      blockReason: >-
        kill/pkill 指向 dsh 引擎进程会终止安全监控（插件随引擎进程消亡），已被安全策略阻断；包括通过运行时变量（如 kill "$LP"、kill $PID）指向监听进程的间接形式，按端口杀死监听进程的 fuser
        -k，以及 PowerShell 的 Stop-Process / Stop-Service
