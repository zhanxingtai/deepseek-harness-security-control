            path: /opt/app/readme.md
        expectedDecision: allow
    notes: >-
      插件自身保护 — 纵深链规则,priority 1490。起 plugin_* 与 extension_* 拆轨：
      本条只管 plugin_* 且必须命中 paramsRegex.name 锚点；extension_* 移交
      self-protection-warn-mutating-extension-tools（warn 级）。拆轨理由是「插件」与
      「编辑器扩展」在开源场景下的正常使用频率差了两个数量级，后者按告警承接更合适。
      锚点只覆盖 name 字段是刻意取舍：path / action / command 三个字段分别已由
      gateway 家族与 self-protection-block-uninstall 覆盖，此处补的是它们唯一剩下的缺口。

  - id: self-protection-warn-mutating-extension-tools
    name: 工具栈层：告警指向安全监控自身的扩展类工具操作
    enabled: true
    priority: 1489
