          - \b(?:gdb|ltrace|strace|perf)\b[^&|;\n]{0,80}?--attach[=\s]+\d{1,7}\b
          - \bgdb\b[^&|;\n]{0,40}?-ex\b[^&|;\n]{0,80}?(?:attach|call|jump|set\s+pc)\b[^&|;\n]{0,80}?\d{1,7}\b
          - \bstrace\b[^&|;\n]{0,80}?-p\s+\d{1,7}\b
