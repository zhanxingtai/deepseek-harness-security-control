  - id: self-protection-escalate-on-behavior-block
    name: 应用层：system 层 behaviorBlock 触发后升级处理
    # 停用：riskFlagsAny: ['self_protection_behavior'] 全仓零生产点。运行时实际
    # push 的自保护旗标是 self_protection_internal，且只在 RuntimeHook 吞掉内部
    # guard 异常时上报（RuntimeHook.ts:923 / 1305），语义是「内部错误已吞」不是
    # 「行为被系统层阻断」——改挂过去会在每次 guard 异常时 escalate，是更糟的误报。
    # 与同批停用的 self-protection-asset-* 六条同病因（详见其 notes）。
    # 恢复条件：系统层落地 behaviorBlock 并 emit self_protection_behavior 之后。
    enabled: false
    priority: 1400
    category: self_protection
    severity: high
    match:
      actionType:
        - agent_tool_call
      riskFlagsAny:
        - self_protection_behavior
    action:
      decision: escalate
      blockReason: 系统层 behaviorBlock 触发后请求人工审核（plan §四 4.13.8）
      blockCode: SELF_PROTECTION_ESCALATE_037
      appealable: true
    testCases:
