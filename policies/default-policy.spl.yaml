            asset_path: /root/.dsh/some-other-config.yaml
            content: 'ok: true'
        expectedDecision: allow
    notes: |
      插件自身保护 — 资产层（纵深链）。

      **2026-10-21 停用：本规则组永不触发。**
      match 声明 actionType: asset_change / asset_remove，但本仓不存在任何
      运行时生产者 —— src/ 下没有 actionType: "asset_change" 的 emit 点，
      只有三处非 emit 的声明：
        - src/collectors/LocalNdjsonSink.ts（actionType 白名单）
        - src/intervention/RuleLoader.ts（KNOWN actionType 列表）
        - src/utils/events/schema.ts（字段 schema）
      资产采集器已在开源清理中移除，规则留着、生产者没了。
      此前 testCases 全绿是假象：verify-self-protection-runner.ts 与
      scripts/spl-eval-corpus.mjs 直接构造 asset_change 事件喂给引擎。
      策略审计里这 6 条规则合计 51 条漏报，全部源于此。

      恢复条件：重新引入能 emit asset_change 的采集器，把 enabled 改回 true，
      并删掉本段与另外 5 条规则上方的停用注释。
