  - id: self-protection-block-restart-without-patch
    name: 阻止不带 security-monitor --patch 参数重启 dsh 引擎
    enabled: true
    priority: 1100
    category: self_protection
    severity: high
    match:
      actionType:
        - agent_tool_call
        - process_start
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
        - python
        - python3
        - node
        - pnpm
        - npm
        - npx
        - dsh
        - dshe
        - tsx
        - ts-node
        - systemd-run
        - systemctl
        - pwsh
        - powershell
        - powershell.exe
        - cmd
      paramsRegex:
        command:
          - \bpnpm\s+(exec\s+)?dsh\b(?!.{0,600}--patch\s+.{0,120}?security-monitor)
          - \bnpx?\s+dsh\b(?!.{0,600}--patch\s+.{0,120}?security-monitor)
          - \bnode\s+[^&|;\s]{0,80}?bin\.ts\b(?!.{0,600}--patch\s+.{0,120}?security-monitor)
          - >-
            (?:/usr/bin|/usr/local/bin|/opt/[^/ ]+/bin|~[^/ ]*/bin|/root/\.nvm/versions/[^/ ]+/bin|/home/[^/
            ]+/\.nvm/versions/[^/
            ]+/bin)/(pnpm|npm|npx|node|nodejs|tsx|ts-node|dsh)\b[^&|;\n]{0,40}?(dsh\b|bin\.ts\b)(?!.{0,600}--patch\s+.{0,120}?security-monitor)
          - >-
            (?:/usr/bin|/usr/local/bin|/opt/[^/
            ]+/bin)/(pnpm|npm|npx)\b\s+(exec\s+)?dsh\b(?!.{0,600}--patch\s+.{0,120}?security-monitor)
    action:
      decision: warn
      message: >-
        重启 dsh 引擎时建议携带 security-monitor --patch 参数以加载安全监控。 用户重启服务是常态（用户原则 1："宁可降低拦截，标记威胁告警"），
        仅留痕告警，不阻断操作（2026-08-17 改为前缀级匹配：任何不带 --patch 的 pnpm dsh / npx dsh / node bin.ts 启动均告警，封堵 we$B 等字符拆分绕过）
      blockCode: SELF_PROTECTION_RESTART_WITHOUT_PATCH_015
      appealable: true
    testCases:
      - name: pnpm exec dsh 不带 --patch 触发 warn
        input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: pnpm exec dsh web
        expectedDecision: warn
      - name: pnpm exec dsh 带 --patch security-monitor allow
        input:
          actionType: agent_tool_call
          toolName: bash
          params:
            command: pnpm exec dsh web --patch security-monitor
        expectedDecision: allow
    notes: "阻止不带 --patch security-monitor 标志的引擎重启。决策矩阵见 `docs/severity-decision-matrix.md` §2（`self_protection` + `severity: high` + `action.decision: warn` → engine 终态 `warn`；不参与 §4 的 engine 降级，因为 action 已经显式 `warn`）。"
  - id: self-protection-block-write-disabler-script
