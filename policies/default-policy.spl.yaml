            path: /root/.pypirc
        expectedDecision: warn
      - name: 读取 /root/.bash_history 触发 warn（shell 历史）
        input:
          actionType: agent_tool_call
          toolName: file_read
          params:
            path: /root/.bash_history
        expectedDecision: warn
      - name: 读取 /root/.ssh/id_rsa.pub 不命中（公钥非敏感本体）
        input:
