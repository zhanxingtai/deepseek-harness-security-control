          不引入路径级 carve-out（保守优先）。
      风险与缓解：python 裸管道（无 -m/-c）仍 block——攻击者用 `| python` 直接进 REPL
      仍是确凿威胁。如需进一步细分 python 用法（区别 -m 数据处理 vs 脚本执行），
      由 spec §6.5 灰度观察期动态调整。
      修复:`-r`/`-M`/`-e`/`-m`/`-c` 白名单前瞻要求 flag 后空白,导致
      `ruby -rjson`/`perl -MJSON` 等参数粘连形态被误拦;改为 `\S{0,64}(?:\s|$)`
      兼容粘连与分离两种写法。
  - id: block-exec-rm-root-critical
    name: 阻断 exec 危险删除
    enabled: true
    priority: 950
    category: intrusion_defense
    severity: critical
    match:
      actionType:
        - agent_tool_call
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
      paramsRegex:
        command:
          # 裸根删除的尾界放宽到 shell/字符串分隔符。
          # 原式 `rm\s+-[a-zA-Z]*\s+/($|\s)` 要求 `/` 后紧跟行尾或空白，于是
          # 引号包裹的同一形态整类漏掉：`bash -c "rm -rf /"`、
          # `python -c 'os.system("rm -rf /")'`（golden essentialPositive
          # rm-rf-via-python-c 即此形态）。`/` 后必须是分隔符而非路径字符，
          # 所以 `rm -rf /tmp/build`、`rm -rf ./build`、`rm -rf /opt/app/dist`
          # 依旧不命中。
          - rm\s+-[a-zA-Z]*\s+/(?=$|[\s"';&|])
          - rm\s+-[a-zA-Z]*\s+/\*
          # 原 `rm\s+-rf\s+/(\s|$)` 与 `rm\s+-rf\s+/\*` 两条已被上一条的
          # `-[a-zA-Z]*` 完全覆盖（`-rf` 两个字符都落在 [a-zA-Z] 内），删除以免
          # 同一威胁两份正则各自漂移。
          - rm\s+-rf\s+--no-preserve-root
          - dd\s+if=\S+\s+of=/dev/[sh]da
          - mkfs\.\w+\s+/dev/[sh]da
    action:
      decision: block
      blockReason: 检测到危险删除或磁盘破坏命令，已被安全策略阻断(critical commands)
      blockCode: INTRUSION_DEFENSE_MASS_DELETION_005
      appealable: true
    testCases:
      - name: rm -rf / 触发 block
        input:
          actionType: agent_tool_call
          toolName: exec
          params:
            command: rm -rf /
        expectedDecision: block
      - name: rm -rf /tmp/build 不命中
        input:
          actionType: agent_tool_call
          toolName: exec
          params:
            command: rm -rf /tmp/build
        expectedDecision: allow
      - name: bash -c "rm -rf /" 引号包裹形态仍触发 block(2026-10-21 尾界放宽)
        input:
          actionType: agent_tool_call
          toolName: exec
          params:
            command: bash -c "rm -rf /"
        expectedDecision: block
      - name: 解释器 -c 内嵌 os.system("rm -rf /") 触发 block(golden rm-rf-via-python-c)
        input:
          actionType: agent_tool_call
          toolName: exec
          params:
            command: python -c 'import os; os.system("rm -rf /")'
        expectedDecision: block
      - name: 解释器 -c 内嵌 rm -rf ./build 相对路径不命中(负向)
        input:
          actionType: agent_tool_call
          toolName: exec
          params:
            command: python -c 'import os; os.system("rm -rf ./build")'
        expectedDecision: allow
      - name: rm -rf /opt/app/dist 带前缀的绝对路径不命中(负向)
        input:
          actionType: agent_tool_call
          toolName: exec
          params:
            command: rm -rf /opt/app/dist
        expectedDecision: allow
    notes: |
      默认阻断规则 — 拦截已知危险行为。
      2026-10-21：裸根删除尾界由 `($|\s)` 放宽为 `(?=$|[\s"';&|])`，补上
      `bash -c "rm -rf /"` 与解释器 -c 内嵌 `os.system("rm -rf /")` 两个此前
      整类漏掉的形态。放宽只影响 `/` 之后的收尾判定，`/` 后接路径字符的
      /tmp / ./ /opt/... 全部保持不命中。
  - id: block-exec-rm-root-warn
    name: 阻断 exec 危险删除
    enabled: true
    priority: 930
    category: intrusion_defense
    severity: medium
    match:
      actionType:
        - agent_tool_call
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
      paramsRegex:
        command:
          # === /root/ 宽口径保留（agent / root 自身相关）===
          - rm\s+-[a-zA-Z]*r[a-zA-Z]*\s+/root/
          # === /home/ 仅命中敏感子目录（不再一刀切整个家目录）===
          #   P1 FP 收窄：corpus 标记 `rm -rf /home/u/Downloads`
          #   等合法 ops 为负例，需要拆解敏感路径集。
          - rm\s+-[a-zA-Z]*r[a-zA-Z]*\s+/home/[^/\s]+/\.(ssh|gnupg|gpg|aws|kube|docker|gcloud|azure|terraform|ansible|config\.git|netrc|pypirc)\b
          - rm\s+-[a-zA-Z]*r[a-zA-Z]*\s+/home/[^/\s]+/\.(bash_history|zsh_history|mysql_history|psql_history|pgpass|pg_service\.conf)\b
          - rm\s+-[a-zA-Z]*r[a-zA-Z]*\s+/home/[^/\s]+/\.(bashrc|zshrc|bash_profile|zsh_profile|profile|bash_env|env|config|local|sudoers)\b
      # paramsNotRegex：纯下载缓存 / 临时目录不算敏感（额外兜底）
      paramsNotRegex:
        command:
          - \b(Downloads|Temp|tmp|cache|Cache|node_modules|\.git)\b
    action:
      decision: warn
      message: 阻断 exec 危险删除:命中非 critical 命令,仅记录,工具继续执行
      blockCode: INTRUSION_DEFENSE_MASS_DELETION_002
      appealable: true
    testCases:
      - name: rm -rf /root/old_files 触发 warn
        input:
          actionType: agent_tool_call
          toolName: exec
          params:
            command: rm -rf /root/old_files
        expectedDecision: warn
      - name: 无 flag rm 不命中
        input:
          actionType: agent_tool_call
          toolName: exec
          params:
            command: rm /tmp/test.txt
        expectedDecision: allow
  - id: block-exec-process-termination-warn
    name: 阻断 exec 终止进程
    enabled: true
    priority: 900
    category: intrusion_defense
    severity: medium
    match:
      actionType:
        - agent_tool_call
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
      paramsRegex:
        # 只保留「杀掉 init / 核心系统服务」这一类：`kill -9 1`、`pkill systemd`、
        # `killall sshd`。任意 PID（`kill -9 12345`）是日常 ops 不是攻击面——
        # 原式 `^\s*kill\s+(?:-9|-KILL|-SIGKILL|-SIGABRT)\s+\d+` 把所有强信号
        # kill 都算进去，dev/CI 环境每天误报（实测 FPR 12.5%，语料负例
        # `kill -9 12345` / `kill -TERM 1234` 全部命中）。
        #
        # 顺带删掉 paramsNotRegex 的语言运行时/框架白名单：它是「整条命令里出现
        # 任一白名单词就整条放行」，`pkill -9 -f systemd; echo node` 即绕过——
        # 一个可利用的规避面。收窄到具体进程名后白名单不再必要。真正要硬拦的
        # 「杀掉监控自身」由 self-protection-block-harness-process-kill 以引擎名
        # 锚点承接，降 warn 不影响那条自保护链。
        command:
          - ^\s*kill\s+(?:-9|-KILL|-SIGKILL|-SIGABRT|-6)\s+1(?:\s|$)
          - ^\s*kill\s+(?:-9|-KILL|-SIGKILL|-SIGABRT|-6)?\s*\$\(\s*pgrep\b[^)]*\b(?:systemd|init|sshd|cron|upstart|supervisord|dockerd|kubelet)\b
          - ^\s*(?:pkill|killall)\b[^\n]*\b(?:systemd|init|sshd|cron|upstart|supervisord|dockerd|kubelet)\b
    action:
      decision: warn
      message: 通过 exec 终止进程已被记录,工具继续执行
      blockCode: INTRUSION_DEFENSE_PROCESS_TERMINATION_006
      appealable: true
    testCases:
      # 前两条原期望 block（裸 PID / pkill node 现由 014 兜住）
      - name: 裸 PID kill 放行（FPR 收敛，无强信号且不指名进程）
        input:
          actionType: agent_tool_call
          toolName: exec
          params:
            command: kill 12345
        expectedDecision: allow
      - name: pkill node 放行（2026-10-21 FPR 收敛，dev server 重启）
        input:
          actionType: agent_tool_call
          toolName: exec
          params:
            command: pkill node
        expectedDecision: allow
      - name: kill -l 列信号不命中（负向）
        input:
          actionType: agent_tool_call
          toolName: exec
          params:
            command: kill -l
        expectedDecision: allow
      # -USR1 是用户自定义信号，非强信号
      - name: kill -USR1 12345 放行（2026-10-21 FPR 收敛，-USR1 非强信号）
        input:
          actionType: agent_tool_call
          toolName: exec
          params:
            command: kill -USR1 12345
        expectedDecision: allow
      # 收敛的另一面：只有 init / 核心系统服务仍告警，任意 PID 放行
      - name: kill -9 12345 放行（2026-10-21 FPR 收敛，任意 PID 是日常 ops）
        input:
          actionType: agent_tool_call
          toolName: exec
          params:
            command: kill -9 12345
        expectedDecision: allow
      - name: kill -9 1 触发 warn（杀 init，属核心系统服务）
        input:
          actionType: agent_tool_call
          toolName: exec
          params:
            command: kill -9 1
        expectedDecision: warn
      - name: kill -9 $(pgrep -f systemd) 触发 warn（间接杀 init）
        input:
          actionType: agent_tool_call
          toolName: exec
          params:
            command: kill -9 $(pgrep -f systemd)
        expectedDecision: warn
      - name: killall sshd 触发 warn（核心系统服务）
        input:
          actionType: agent_tool_call
          toolName: exec
          params:
            command: killall sshd
        expectedDecision: warn
    notes: 默认阻断规则 — 拦截已知危险行为。
  - id: block-exec-privilege-escalation
    name: 阻断 exec 权限提升
    enabled: true
    priority: 900
    category: intrusion_defense
    severity: critical
    match:
      actionType:
        - agent_tool_call
      toolName:
        - exec
        - execute
        - run_command
        - bash
        - shell
        - sh
      paramsRegex:
        command:
          - sudo\s+.*chmod\s*[\w]*\+s
          - sudo\s+.*chown\s+root
          - sudo\s+.*visudo
          - su\s+-\s*root
          - su\s+root
          - pkexec\s+
          - setuid\s*\(
    action:
      decision: block
      blockReason: 检测到权限提升命令，已被安全策略阻断
      blockCode: INTRUSION_DEFENSE_PRIV_ESC_007
