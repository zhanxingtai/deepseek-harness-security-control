name: CI

# 2026-10-21: merged the former ci.yml + governance-package.yml into one
# workflow. Job names follow the sibling openclaw-security-control convention
# (linux-package / macos-package / windows-package) so a red leg is
# self-explanatory in the Actions UI instead of reading as `package (windows)`.
#
# What changed, and why:
#   - `build-and-test` → `linux-package`. It absorbs governance-package's
#     ubuntu leg, which was a verbatim duplicate (same `pnpm test`, same node
#     22, same install).
#   - `package` matrix [ubuntu, macos, windows] → `linux-package` (carrying the
#     node 22/24 matrix) + `macos-package` + `windows-package`.
#   - `pnpm verify` split into its 7 underlying gates as individually named
#     steps. The old `&&` chain stopped at the first failure, so a red run said
#     only that the chain broke, not which gate or why. Each gate name mirrors
#     a `verify:*` script in package.json — the gate LIST is now duplicated
#     between the two files, so a new gate must be added in both places.
#
# NOT changed: this file previously had no `tags:` filter, and still doesn't.
# `release` gates itself on `github.ref_type == 'tag'`, so branch pushes run
# every other job and skip packaging.
#
# ⚠ branch protection: `build-and-test` no longer exists as a job name. Any
# required-status-check rule referencing it must be renamed to `linux-package`,
# or PRs will block forever waiting on a check that can never report.

on:
  push:
  pull_request:
    # Drop the branch filter so PRs against any working branch run the
    # same gates. Public forks land on `main`, but contributors may also
    # open PRs from `feature/*` etc. — excluding them only re-creates the
    # silent-CI failure mode this file previously had.

# Default to least-privileged token. Only the `release` job widens this, and it
# declares `contents: write` locally — no other job writes to the repo.
permissions:
  contents: read

# Cancel superseded runs on the same branch to save minutes. Don't cancel
# pushes — those are usually fast-followed by the same SHA.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Open-source hygiene: keep this repo free of external adapter code and
  # machine-specific absolute paths, so it can be published as-is.
  open-source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Forbid absolute file: dependencies"
        run: |
          if grep -rE '"file:/' --include=package.json . ; then
            echo "::error::absolute file: dependencies are forbidden; use registry versions or relative file: paths"
            exit 1
          fi

      - name: Forbid adapters/ directory
        run: |
          if [ -d adapters ]; then
            echo "::error::adapters/ directory is not allowed in this repository"
            exit 1
          fi

  # Primary gate. Everything that can block a release runs here on ubuntu,
  # across both supported Node majors.
  linux-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Must match `engines.node` (^22.19.0 || >=24.0.0) and
        # `dshWorkshop.compatibility.nodeVersions`. 18/20 were never
        # supported — CI on them only ever tested an unsupported runtime.
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 2026-09-19: pin to 10.x. pnpm 11+ forces metadata-only fetches
          # for peerDependencies during install, and pnpm 11 returns
          # ERR_PNPM_FETCH_404 for deps outside the pnpm-10 happy path even
          # with strict-peer-dependencies=false (see pnpm/pnpm#9490). The fix
          # landed only for some scenarios; the cleanest option is to stay
          # on 10 until pnpm exposes a proper skip-private-peer-metadata
          # npmrc key.
          #
          # ⚠ `auto-install-peers` in .npmrc MUST stay equal to
          # `settings.autoInstallPeers` in pnpm-lock.yaml, or every
          # `--frozen-lockfile` install below aborts with
          # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH before it fetches anything.
          version: 10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # 2026-09-25 oss-prep: explicit cache-dependency-path keeps the
          # pnpm store keyed on the exact lockfile — if a contributor
          # forgets to commit `pnpm-lock.yaml` the install step will fail
          # loudly instead of silently falling back to a stale cache
          # entry from a previous lockfile revision. The default
          # detection (`pnpm-lock.yaml` at workspace root) already
          # worked, but making it explicit survives `actions/setup-node`
          # version bumps that change the default heuristic.
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Marketplace contract, one gate per step so a red run names the gate.
      # Order and set must match the `verify` script in package.json.
      - name: Verify self-contained
        run: pnpm run verify:self-contained
      - name: Verify artifacts
        run: pnpm run verify:artifacts
      - name: Verify README sync
        run: pnpm run verify:readme-sync
      - name: Verify action-type producers
        run: pnpm run verify:action-type-producers
      - name: Verify SPL block code
        run: pnpm run verify:spl-block-code
      - name: Verify test-case coverage
        run: pnpm run verify:test-cases-coverage
      - name: Verify self-protection
        run: pnpm run verify:self-protection

      # Confirm the marketplace tarball packs cleanly (no warnings about missing
      # peerDependencies / shadowed files). The tgz itself is not uploaded here —
      # marketplace nodes consume it via `pnpm dsh plugin add --source <tgz>`.
      - name: Verify marketplace tarball
        run: npm pack --dry-run

  # macOS leg. Carries two things the ubuntu gate cannot:
  #   1. real filesystem-semantics coverage — AGENTS.md §6 records an unfixed
  #      SensitivePathGuard bug where HOME is compared lexically while candidate
  #      paths are realpath'd, so the symlink-bypass case fails when HOME sits
  #      behind a symlink (macOS /var → /private/var);
  #   2. the only non-dry-run `npm pack`, so a tgz is downloadable from any push
  #      without waiting for a tag.
  macos-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          # Must match `engines.node` (^22.19.0 || >=24.0.0); 20 was
          # below the supported floor.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Marketplace tarball — consumed by `pnpm dsh plugin add --source <tgz>`
      # on marketplace nodes.
      - name: Pack marketplace tarball
        env:
          NPM_CONFIG_SCRIPT_SHELL: bash
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: sst-security-control-dsh-macos
          path: sst-security-control-dsh-*.tgz
          if-no-files-found: error

  # Windows leg. `shell: bash` makes every `run:` step execute under Git Bash —
  # on `windows-latest` this avoids cmd.exe's path/glob/quoting surprises and is
  # the only way pnpm and npm reliably resolve on a fresh runner (Git for
  # Windows puts bash at C:\Program Files\Git\bin).
  windows-package:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # `NPM_CONFIG_SCRIPT_SHELL=bash` makes npm spawn prepack / pre-* /
      # post-* hooks under bash on Windows. prepack invokes
      # `bash scripts/verify-self-protection.sh`, which would otherwise
      # fail under cmd.exe (no `bash` on PATH by default there).
      - name: Pack marketplace tarball
        env:
          NPM_CONFIG_SCRIPT_SHELL: bash
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: sst-security-control-dsh-windows
          path: sst-security-control-dsh-*.tgz
          if-no-files-found: error

  # Publish the plugin tarball to GitHub Releases on any tag (no prefix
  # requirement). The tarball is cross-platform (pure JS client + vendored
  # assets), so a single ubuntu build publishes it; all gates must pass first.
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [open-source-hygiene, linux-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # prepack hook re-runs prepare + all verify gates, so a tagged
      # release cannot ship a bundle that fails marketplace contract.
      - name: Pack tarball
        run: |
          mkdir -p install
          # `pnpm run pack`, not `pnpm pack` — pnpm's built-in `pack` ignores
          # --pack-destination and writes the tgz to the cwd. The npm script
          # named "pack" runs `npm pack --pack-destination install`, which is
          # what we actually want.
          pnpm run pack

      - name: Rename tarball with tag
        run: |
          src=$(ls install/sst-security-control-dsh-*.tgz)
          dst="install/sst-security-control-dsh-${GITHUB_REF_NAME}.tgz"
          # 包内版本号与 tag 一致时源/目标同名，mv 会报 "same file"
          if [ "$src" != "$dst" ]; then mv "$src" "$dst"; fi

      - uses: softprops/action-gh-release@v2
        with:
          files: install/sst-security-control-dsh-*.tgz