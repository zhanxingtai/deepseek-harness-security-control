name: Governance package

on:
  push:
  pull_request:

# Default to least-privileged token.
permissions:
  contents: read

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    # `shell: bash` makes every `run:` step execute under Git Bash. On
    # `windows-latest` this avoids cmd.exe's path/glob/quoting surprises
    # and is the only way `pnpm` and `npm` reliably resolve on a fresh
    # runner (Git for Windows puts bash at C:\Program Files\Git\bin).
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          # Must match `engines.node` (^22.19.0 || >=24.0.0); 20 was
          # below the supported floor.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Marketplace tarball — replaces the pre-S5 `pnpm build:install` + governance-assets upload.
      # The .tgz is consumed by `pnpm dsh plugin add --source <tgz>` on marketplace nodes.
      #
      # `NPM_CONFIG_SCRIPT_SHELL=bash` makes npm spawn prepack / pre-* /
      # post-* hooks under bash on Windows. prepack invokes
      # `bash scripts/verify-self-protection.sh`, which would otherwise
      # fail under cmd.exe (no `bash` on PATH by default there).
      - name: Pack marketplace tarball
        env:
          NPM_CONFIG_SCRIPT_SHELL: bash
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: sst-security-control-dsh-${{ matrix.os }}
          path: sst-security-control-dsh-*.tgz
          if-no-files-found: error
